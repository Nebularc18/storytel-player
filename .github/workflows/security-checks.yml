name: Security regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix server
          npm ci --ignore-scripts --prefix client
      - name: Verify security boundaries and build
        run: |
          npm test
          npx --no-install tsc --noEmit -p server/tsconfig.json
          npm run server:build
          npm run electron:build
          npm run build
