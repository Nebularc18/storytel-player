name: Tagged Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag and source
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/validate-release-tag.cjs >> "$GITHUB_OUTPUT"
          # Release only commits already integrated into this fork's default branch.
          git fetch origin develop
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop

  windows:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/windows-validation.yml

  publish:
    needs: [validate, windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-installer
          path: release
      - name: Verify installer checksum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          directory = Path('release')
          installers = list(directory.glob('*.exe'))
          if len(installers) != 1:
              raise SystemExit('Exactly one Windows installer is required')
          installer = installers[0]
          expected = re.search(r'\b[0-9a-fA-F]{64}\b', (directory / 'windows-installer-sha256.txt').read_text(encoding='utf-8-sig'))
          actual = hashlib.sha256(installer.read_bytes()).hexdigest()
          if not expected or actual != expected.group().lower():
              raise SystemExit('Installer checksum mismatch')
          (directory / 'SHA256SUMS.txt').write_text(f'{actual}  {installer.name}\n')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          cat > release-notes.md <<'NOTES'
          Patched unofficial Storytel Player for Windows x64.

          Download the `.exe` installer below. `SHA256SUMS.txt` contains its SHA-256 checksum.

          This release includes OS-encrypted saved sessions, removal of saved passwords and automatic password login, Electron sandbox and IPC restrictions, disabled automatic updates, and dependency advisory fixes.

          Before publication, the workflow checked dependency advisories, ran regression tests, built the installer, verified native Windows encryption across restart and offline fixture playback/seeking, and installed and launched the packaged player in a disposable Windows runner.

          The installer is unsigned. Real Storytel login, Google/Apple SSO and live audiobook downloads still require acceptance testing. This is an unofficial application, independent of Storytel. Automatic updates remain disabled.
          NOTES
          release_flags=()
          if [ "$IS_PRERELEASE" = 'true' ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt \
            --repo "$GH_REPO" --verify-tag --title "Storytel Player $RELEASE_TAG for Windows" \
            --notes-file release-notes.md "${release_flags[@]}"
